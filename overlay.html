<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Auction Overlay Simple</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div class="overlay">
  <div class="simple-panel">
    <section class="title-section">
      <h1 id="auctionTitle">TOP 1-3 SAMAKAN TIGA GAMBAR (NOMINIM COIN) WAJIB LOVE OREN DI AWAL 🧡 GA LOVE OREN GA SAH</h1>
    </section>

    <section class="timer-section">
      <div id="timer">05:00</div>
      <div class="timer-label">Waktu Tambahan(detik)</div>
      <div class="progress"><span id="progressBar"></span></div>
    </section>

    <section class="participants-box">
      <div class="participants-head">
        <span class="box-label">PESERTA SAAT INI</span>
        <span class="participants-total">REALTIME</span>
      </div>
      <main id="rankingList"></main>
    </section>

    <div class="coin-total">🪙 <b id="totalCoins">0</b> COIN</div>
  </div>
</div>

<div id="winnerPopup"><div><span>👑</span><p>PEMENANG LELANG</p><h2 id="winnerName">-</h2><strong id="winnerCoins">0 COIN</strong></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="overlay.js"></script>
</body>
</html>
